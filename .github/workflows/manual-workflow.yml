name: Manual workflow

on:
  workflow_dispatch:
    inputs:
      CPCLOUD-account:
        description: CPCLOUD-account
        type: boolean
        default: false
      CPCLOUD-daas:
        type: boolean
        default: false

jobs:
  say-hi:
    runs-on: ubuntu-latest
    steps:
      - name: Collect selected repositories
        id: select
        run: |
          echo "HI" >> "$GITHUB_STEP_SUMMARY"
